<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="23N AI Labs — independent, reproducible AI research">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#101a36"/>
      <stop offset="1" stop-color="#0a1530"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#glow)"/>

  <!-- subtle plotting grid -->
  <g stroke="#2a3a64" stroke-width="1" opacity="0.35">
    <line x1="0" y1="90" x2="1280" y2="90"/>
    <line x1="0" y1="180" x2="1280" y2="180"/>
    <line x1="0" y1="270" x2="1280" y2="270"/>
    <line x1="320" y1="0" x2="320" y2="360"/>
    <line x1="640" y1="0" x2="640" y2="360"/>
    <line x1="960" y1="0" x2="960" y2="360"/>
  </g>

  <!-- forecast motif: observed series, prediction, and a scatter of runs -->
  <path d="M60 300 L180 250 L300 268 L420 200 L540 214 L660 150"
        fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M60 318 L180 268 L300 286 L420 218 L540 232 L660 168 L800 120 L940 138 L1080 86 L1220 104 L1220 330 L60 330 Z"
        fill="url(#fill)" opacity="0.9"/>
  <path d="M660 150 L800 104 L940 122 L1080 70 L1220 92"
        fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 10"/>
  <g fill="#e2e8f0">
    <circle cx="180" cy="250" r="4"/><circle cx="420" cy="200" r="4"/><circle cx="660" cy="150" r="5"/>
  </g>
  <g fill="#22d3ee">
    <circle cx="800" cy="104" r="5"/><circle cx="1080" cy="70" r="5"/><circle cx="1220" cy="92" r="5"/>
  </g>

  <!-- wordmark -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="60" y="112" font-size="76" font-weight="700" fill="#f8fafc" letter-spacing="1">23N</text>
    <text x="222" y="112" font-size="76" font-weight="300" fill="url(#accent)" letter-spacing="2">AI&#160;Labs</text>
    <text x="62" y="152" font-size="22" font-weight="500" fill="#93a4c8" letter-spacing="3">INDEPENDENT · REPRODUCIBLE · OPEN</text>
  </g>

  <!-- tagline -->
  <text x="62" y="196" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="20" fill="#cbd5e1">Applied AI research with public code, data, and evidence.</text>
</svg>
